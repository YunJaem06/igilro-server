name: Server CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@b9bee63ef481cc545e4517ec730544a4d8b1dfa0 # v6.4.0
        with:
          cache-provider: basic
      - name: Set up Python for offline data-preparation tests
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify PBF extraction with synthetic local fixtures
        run: |
          python -m pip install -r scripts/requirements-osm.txt
          python -m unittest discover -s scripts/tests -v
      - name: Build PostgreSQL/PostGIS image
        run: docker compose build postgres
      - name: Unit, architecture, integration tests and bootJar
        run: ./gradlew clean build --no-daemon
      - name: Build Java 21 application image
        run: docker build --tag igilro-server:ci .
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore
          retention-days: 7
