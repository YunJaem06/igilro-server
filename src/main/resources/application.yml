spring:
  application:
    name: igilro-server
  profiles:
    default: local
  datasource:
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
  sql:
    init:
      mode: never
  jdbc:
    template:
      query-timeout: 3s
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,postgis

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
  paths-to-match: /api/v1/**

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"

igilro:
  shade-prediction:
    file: ${SHADE_PREDICTION_FILE:}
  shade-routing:
    ground-verified-datasets: ${SHADE_GROUND_VERIFIED_DATASETS:}
  places:
    api-key: ${KAKAO_REST_API_KEY:}
    connect-timeout: ${PLACES_CONNECT_TIMEOUT:2s}
    response-timeout: ${PLACES_RESPONSE_TIMEOUT:3s}
    requests-per-second: ${PLACES_REQUESTS_PER_SECOND:4}
